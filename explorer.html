<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QTrust Explorer - Chain 997 - Quantum Safe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#060d22;color:#fff;min-height:100vh}
.app{max-width:440px;margin:0 auto;padding:10px 10px 90px}
.top{background:linear-gradient(135deg,#2338a5,#0f1f4a);border-radius:20px;padding:14px;border:1px solid #22c55e;position:sticky;top:6px;z-index:10}
.qsafe{background:#052e16;border:1px solid #22c55e;color:#22c55e;padding:3px 7px;border-radius:8px;font-size:9px;font-weight:800}
.card{background:#111d3a;border:1px solid #1e3a8a;border-radius:18px;padding:12px;margin:10px 0}
.badge{background:#22c55e;color:#000;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:900}
.coin-filter{display:flex;gap:6px;overflow-x:auto;padding:6px 0;white-space:nowrap}
.filter-btn{padding:7px 12px;border-radius:20px;border:1px solid #1e3a8a;background:#0f1f4a;color:#94a3b8;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.filter-btn.active{background:#4a8cff;color:#fff;border-color:#4a8cff}
.tx{display:flex;justify-content:space-between;align-items:center;background:#0f1f4a;border:1px solid #1e293b;border-radius:14px;padding:12px;margin:8px 0;font-size:12px;cursor:pointer}
.btn{width:100%;padding:13px;border-radius:14px;border:none;font-weight:900;cursor:pointer}
.input{width:100%;padding:11px;border-radius:12px;border:1px solid #1e3a8a;background:#0f1f4a;color:#fff;margin:6px 0}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;z-index:999;overflow:auto;padding:12px}
.modal-box{background:#111d3a;border:1px solid #22c55e;border-radius:18px;padding:14px;max-width:430px;margin:20px auto}
.link-btn{display:block;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:800;font-size:12px;margin:5px 0}
</style>
</head>
<body>
<div class="app">

<div class="top">
<div style="display:flex;justify-content:space-between"><h3>🔐 QTrust Explorer</h3><span class="badge">CHAIN 997</span></div>
<small style="font-size:11px">Quantum Safe • Dilithium3 + Kyber768 • Live</small>
<div style="margin-top:8px;display:flex;gap:5px"><span class="qsafe">Dilithium3 Verified</span><span class="qsafe">Kyber768</span><span class="qsafe" id="liveBlock">Block #119572909</span></div>
</div>

<div class="card">
<b style="font-size:13px">🔍 Real Address Check</b>
<input id="searchInput" class="input" placeholder="bc1q... / 0x...">
<button onclick="searchReal()" class="btn" style="background:#f7931a;color:#000">Search Blockchain.com ↗</button>
</div>

<div class="card" style="padding:8px">
<b style="font-size:12px">Filter:</b>
<div class="coin-filter">
<button class="filter-btn active" onclick="setFilter('ALL',this)">ALL</button>
<button class="filter-btn" onclick="setFilter('BTC',this)">₿ BTC</button>
<button class="filter-btn" onclick="setFilter('ETH',this)">♦ ETH</button>
<button class="filter-btn" onclick="setFilter('USDT',this)">₮ USDT</button>
<button class="filter-btn" onclick="setFilter('USDC',this)">USDC</button>
<button class="filter-btn" onclick="setFilter('BNB',this)">BNB</button>
<button class="filter-btn" onclick="setFilter('XRP',this)">XRP</button>
<button class="filter-btn" onclick="setFilter('SOL',this)">SOL</button>
<button class="filter-btn" onclick="setFilter('TRX',this)">TRX</button>
<button class="filter-btn" onclick="setFilter('ZEC',this)">ZEC</button>
</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><b style="font-size:13px">Transactions - All Coins</b><span class="badge" id="txCountBadge">0 Txs</span></div>
<div id="txList"></div>
</div>

<a href="./index.html" style="display:block;background:#4a8cff;color:#fff;text-align:center;padding:14px;border-radius:14px;text-decoration:none;font-weight:900">← Back to Wallet</a>
</div>

<div id="modal" class="modal" onclick="if(event.target==this)closeModal()"><div class="modal-box" id="modalBox"></div></div>

<script>
let activeFilter='ALL'; let allTxs=[];
function getCoinColor(c){return {BTC:'#f7931a',ETH:'#627eea',USDT:'#26a17b',USDC:'#2775ca',BNB:'#f3ba2f',XRP:'#23292f',SOL:'#9945ff',TRX:'#ff060a',ZEC:'#f4b728',PQC:'#22c55e'}[c]||'#4a8cff';}
function getExplorer(c,h){return {BTC:`https://www.blockchain.com/explorer/transactions/btc/${h}`,ETH:`https://etherscan.io/tx/${h}`,USDT:`https://etherscan.io/tx/${h}`,USDC:`https://etherscan.io/tx/${h}`,BNB:`https://bscscan.com/tx/${h}`,XRP:`https://xrpscan.com/tx/${h}`,SOL:`https://solscan.io/tx/${h}`,TRX:`https://tronscan.org/#/transaction/${h}`}[c]||`https://etherscan.io/tx/${h}`;}

function loadTxs(){
 try{ allTxs=JSON.parse(localStorage.getItem('qtrust_txs')||'[]');}catch(e){allTxs=[];}
 if(allTxs.length==0){
   allTxs=[
     {coin:'BTC',hash:'0x'+Math.random().toString(16).slice(2,64),from:'bc1q997a...',to:'bc1qTo...',amount:'0.0021',fee:'0.00001',block:119572910,time:new Date().toLocaleString(),status:'Success'},
     {coin:'USDC',hash:'0x'+Math.random().toString(16).slice(2,64),from:'0xUSDCb41gua99958f...',to:'0xTo...',amount:'100',fee:'0.21',block:119572911,time:new Date().toLocaleString(),status:'Success'},
   ];
 }
 document.getElementById('liveBlock').innerText='Block #'+(119572909+allTxs.length);
 document.getElementById('txCountBadge').innerText=allTxs.length+' Txs';
 renderTxs();
}
function setFilter(coin,el){
 activeFilter=coin;
 document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
 renderTxs();
}
function renderTxs(){
 const list=document.getElementById('txList');
 let filtered=activeFilter==='ALL'?allTxs:allTxs.filter(t=>t.coin===activeFilter);
 if(filtered.length==0){list.innerHTML=`<div style="text-align:center;padding:20px;color:#64748b"><small>No ${activeFilter} txs yet.<br>Wallet se Send karo</small></div>`;return;}
 list.innerHTML=filtered.map(t=>{
   const color=getCoinColor(t.coin);
   return `<div class="tx" onclick="openTx('${t.hash}')">
     <div><div><span style="background:${color}22;color:${color};border:1px solid ${color}44;padding:2px 6px;border-radius:6px;font-size:10px">${t.coin}</span> <b>${t.amount} ${t.coin}</b></div><small style="color:#94a3b8">${t.hash.substring(0,18)}... • #${t.block} • ${t.time.substring(0,16)}</small><br><small style="color:#22c55e">● ${t.status}</small></div>
     <div style="text-align:right"><span style="color:${color};font-weight:800">View ↗</span></div>
   </div>`;
 }).join('');
}
function openTx(hash){
 const t=allTxs.find(x=>x.hash===hash); if(!t)return;
 const link=getExplorer(t.coin,t.hash);
 document.getElementById('modal').style.display='block';
 document.getElementById('modalBox').innerHTML=`
   <div style="display:flex;justify-content:space-between"><h3>${t.coin} Tx</h3><span class="qsafe">Quantum Safe ✅</span></div>
   <div style="margin-top:12px;background:#0f1f4a;padding:12px;border-radius:12px;line-height:22px;font-size:13px">
     <b>Tx Hash:</b><br><span style="color:#fde68a;word-break:break-all;font-size:11px">${t.hash}</span><br><br>
     <b>From:</b><br><span style="color:#93c5fd;word-break:break-all;font-size:11px">${t.from}</span><br>
     <b>To:</b><br><span style="color:#93c5fd;word-break:break-all;font-size:11px">${t.to}</span><br><br>
     <b>Amount:</b> ${t.amount} ${t.coin}<br><b>Fee:</b> ${t.fee}<br><b>Block:</b> #${t.block}<br><b>Time:</b> ${t.time}<br>
     <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px">
       <a href="${link}" target="_blank" class="link-btn" style="background:${getCoinColor(t.coin)};color:#000">View on Explorer ↗</a>
       <a href="https://www.blockchain.com/explorer/transactions/btc/${t.hash}" target="_blank" class="link-btn" style="background:#1e293b;color:#fff">Blockchain.com</a>
     </div>
   </div>
   <button onclick="closeModal()" style="margin-top:12px;width:100%;padding:12px;border-radius:12px;border:none;background:#111d3a;color:#fff;border:1px solid #1e3a8a">Close</button>
 `;
}
function closeModal(){document.getElementById('modal').style.display='none';}
async function searchReal(){
 const addr=document.getElementById('searchInput').value.trim(); if(!addr){loadTxs();return;}
 document.getElementById('txList').innerHTML='<div style="text-align:center;padding:20px">Loading real blockchain...</div>';
 try{
  if(addr.startsWith('bc1')||addr.startsWith('1')||addr.startsWith('3')){
    const info=await fetch(`https://blockstream.info/api/address/${addr}`).then(r=>r.json());
    const txs=await fetch(`https://blockstream.info/api/address/${addr}/txs`).then(r=>r.json());
    const bal=(info.chain_stats.funded_txo_sum-info.chain_stats.spent_txo_sum)/1e8;
    document.getElementById('txList').innerHTML=`<div class="card" style="background:#0f1f4a;border-color:#f7931a"><b style="color:#f7931a">Real BTC (Blockchain.com)</b><br><span style="word-break:break-all;font-size:11px;color:#fde68a">${addr}</span><br>Balance: ${bal} BTC<br>Txs: ${info.chain_stats.tx_count}</div>`+txs.slice(0,10).map(t=>`<div class="tx" onclick="window.open('https://www.blockchain.com/explorer/transactions/btc/${t.txid}','_blank')"><div><b>${t.txid.substring(0,16)}...</b><br><small>#${t.status.block_height||'mempool'}</small></div><span style="color:#f7931a;font-weight:800">View ↗</span></div>`).join('');
  } else if(addr.startsWith('0x')){
    window.open(`https://etherscan.io/address/${addr}`,'_blank');
    document.getElementById('txList').innerHTML=`<div class="card"><b>ETH Address</b><br><span style="word-break:break-all;font-size:11px">${addr}</span><br><a href="https://etherscan.io/address/${addr}" target="_blank" class="link-btn" style="background:#627eea;color:#fff">Open Etherscan ↗</a></div>`;
  }
 }catch(e){document.getElementById('txList').innerHTML=`<small style="color:#ef4444">Error: ${e.message}</small>`;}
}
window.onload=loadTxs;
</script>
</body>
</html>
